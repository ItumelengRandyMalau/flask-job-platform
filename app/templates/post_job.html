{% extends "base.html" %}

{% block title %}
Post Job
{% endblock %}

{% block content %}

<div class="form-container">

    <h2>Post a Job</h2>

    <form method="POST">

        <div class="form-group">
            <label for="title">Job Title</label>
            <input
                type="text"
                id="title"
                name="title"
                placeholder="e.g. Junior Python Developer"
                required>
        </div>

        <div class="form-group">
            <label for="company">Company</label>
            <input
                type="text"
                id="company"
                name="company"
                placeholder="Company Name"
                required>
        </div>

        <div class="form-group">
            <label for="location">Location</label>
            <input
                type="text"
                id="location"
                name="location"
                placeholder="Johannesburg, Gauteng"
                required>
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                placeholder="Software Development"
                required>
        </div>

        <div class="form-group">
            <label for="salary"> Monthly Salary (ZAR)</label>
            <input
                type="number"
                id="salary"
                name="salary"
                placeholder="30000"
                min="0"
                step="0.01"
                required>
        </div>

        <div class="form-group">
            <label for="description">Job Description</label>
            <textarea
                id="description"
                name="description"
                placeholder="Describe the role, responsibilities, and required skills..."
                required></textarea>
        </div>

        <button type="submit" class="btn-primary">
            Post Job
        </button>

    </form>

</div>

{% endblock %}
